# Onlinespelets API (arbetsordning L21): Apache skickar /api/ vidare till Node-tjänsten tornstriden-online
# på 127.0.0.1:8766. Allt annat (sidor, skript, bilder, ljud) serverar Apache själv från /var/www/tornstriden.
#
# Filen ska INTE aktiveras globalt (ingen a2enconf): den inkluderas i tornstridens virtuella värdar, så att
# andra webbplatser på servern inte får någon proxy. Installera en gång som root från Git-utcheckningen:
#   install -m 644 apache/tornstriden-online.conf /etc/apache2/conf-available/tornstriden-online.conf
#   a2enmod proxy proxy_http headers
# och lägg raden
#   Include conf-available/tornstriden-online.conf
# inuti <VirtualHost> i både sites-available/tornstriden.landychev.se.conf (port 80) och Certbots
# sites-available/tornstriden.landychev.se-le-ssl.conf (port 443). Sedan:
#   apache2ctl configtest && systemctl reload apache2
#
# Varför:
# - ProxyPreserveHost: tjänsten jämför Origin med Host (skydd mot anrop från andra sajter), så den måste se
#   det riktiga värdnamnet, inte 127.0.0.1:8766.
# - X-Forwarded-Proto: bakom HTTPS sätter tjänsten Secure på sessionskakan (TORNSTRIDEN_SECURE=1 i miljöfilen
#   gör samma sak; båda är ofarliga tillsammans).
# - /api/handelser är en Server-Sent-Events-ström som hålls öppen. Tjänsten pingar var 5:e sekund, så
#   timeout=60 räcker; no-gzip hindrar att strömmen buffras om mod_deflate skulle slås på för text/event-stream.
# - Kommandon är små (högst 2 kB i tjänsten); 64 kB i Apache stoppar större anrop innan de når Node.
ProxyPreserveHost On
ProxyPass        "/api/" "http://127.0.0.1:8766/api/" retry=0 timeout=60
ProxyPassReverse "/api/" "http://127.0.0.1:8766/api/"
RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
# Sätt alltid klientadressen från Apache, aldrig från en header som besökaren själv skickat.
RequestHeader set X-Tornstriden-Client-IP "expr=%{REMOTE_ADDR}"

# Gäller bara de virtuella värdar som inkluderar denna fil. CSP tillåter egna resurser och
# inline-stilar för kortgrafiken/kortöversikten, men inga inline-skript eller externa skript.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"
<Location "/api/">
    LimitRequestBody 65536
    SetEnv no-gzip 1
</Location>
