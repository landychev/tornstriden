# Cachning för Tornstriden: sidor, skript och stilmallar hämtas alltid färska efter en deploy
# (webbläsaren validerar mot servern och får 304 när filen är oförändrad). Bilder och ljud cachas som vanligt.
# Fristående från de virtuella värdarna: gäller både HTTP och Certbots HTTPS-värd och rör inte deras filer.
# Installera en gång som root från Git-utcheckningen:
#   install -m 644 apache/tornstriden-cache.conf /etc/apache2/conf-available/tornstriden-cache.conf
#   a2enmod headers && a2enconf tornstriden-cache
#   apache2ctl configtest && systemctl reload apache2
<Directory /var/www/tornstriden>
    <FilesMatch "\.(html|js|css)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</Directory>
