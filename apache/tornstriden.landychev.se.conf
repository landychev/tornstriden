# Installera en gång. Certbot kompletterar sedan med HTTPS på servern.
<VirtualHost *:80>
    ServerName tornstriden.landychev.se
    DocumentRoot /var/www/tornstriden
    DirectoryIndex index.html

    <Directory /var/www/tornstriden>
        Options -Indexes -ExecCGI -Includes
        AllowOverride None
        Require all granted
    </Directory>

    # Onlinespelets API: proxy till Node-tjänsten (se apache/tornstriden-online.conf och DRIFT.md).
    # Lägg samma Include-rad i Certbots HTTPS-värd (tornstriden.landychev.se-le-ssl.conf).
    Include conf-available/tornstriden-online.conf

    ErrorLog ${APACHE_LOG_DIR}/tornstriden-error.log
    CustomLog ${APACHE_LOG_DIR}/tornstriden-access.log combined
</VirtualHost>
